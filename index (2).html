function listHTML(){const q=F.q.toLowerCase();const r=brands().filter(b=>(!F.cat||b.cat===F.cat)&&(!F.st||b.state===F.st)&&(!q||(b.name+b.prod+b.cat).toLowerCase().includes(q))&&(!F.inv||(F.inv==="1"?b.min<5:F.inv==="2"?b.min>=5&&b.min<15:b.min>=15))&&(!F.live||isLive(b))).sort((a,b)=>isLive(b)-isLive(a));
return r.length?r.map(card).join(""):'<p class="sub">No brands match. Clear a filter or search another word.</p>'}
const opts=(a,all)=>`<option value="">${all}</option>`+a.map(x=>`<option ${x===F.cat||x===F.st?"selected":""}>${esc(x)}</option>`).join("");
const pg={
"":()=>`${banner()}<div class="hero"><div class="w"><h1>Find the brand. Get the distributorship.</h1><p>Connect India Distributor links growing Indian brands with distributors, dealers and super stockists in every state.</p>
<form class="sbox" data-f="search"><input name="q" placeholder="Search brand or product" aria-label="Search"><select name="cat" aria-label="Category">${opts(CATS,"All categories")}</select><select name="st" aria-label="State">${opts(STATES,"All India")}</select><button class="btn">Search</button></form>
<div class="stats"><div><strong>${brands().filter(isLive).length}</strong>offering distributorship live</div><div><strong>${STATES.length-1}</strong>regions covered</div><div><strong>${Object.keys(D.enq).length}</strong>enquiries received</div></div></div></div>
<section style="padding:36px 0 0"><div class="w"><div class="card" style="align-items:center;background:#fff"><img src="/_blob/c73003a72d2a8da5f2b615b03bd934fd" alt="Connect India Distributor logo. India's network for distributorship growth." style="max-width:640px;width:100%"></div></div></section><section><div class="w"><h2>Browse by category</h2><p class="sub">Pick the industry you already know.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${CATS.map(c=>`<a class="card cat" data-cat="${esc(c)}">${esc(c)}</a>`).join("")}</div></div></section>
<section style="padding-top:0"><div class="w"><h2>Featured opportunities</h2><p class="sub">Brands looking for distributors now.</p><div class="grid">${brands().filter(b=>b.feat).slice(0,6).map(card).join("")||brands().slice(0,3).map(card).join("")}</div><p><a class="btn alt" href="#/brands">See all brands</a></p></div></section>
<section style="padding-top:0"><div class="w"><h2>How it works</h2><ol class="steps"><li><h3>Search</h3><p>Filter by category, state and investment.</p></li><li><h3>Send an enquiry</h3><p>Share your city, space and experience.</p></li><li><h3>Brand reviews you</h3><p>Our team passes your profile to the brand.</p></li><li><h3>Sign and start</h3><p>Agree terms and begin supplying your territory.</p></li></ol></div></section>
${vtSection()}<section class="band"><div class="w two"><div><h2>Brand owner? Get distributors in new states.</h2><p class="sub">List your products and receive screened enquiries from distributors ready to invest.</p><a class="btn" href="#/list-brand">List your brand</a> <a class="btn alt" href="#/plans">See plans</a></div><div><h3 style="margin-bottom:10px">What distributors say</h3><p>"I found a pharma brand for my city within a week." <span style="color:#C5D3E6">Sample testimonial, replace with real ones.</span></p></div></div></section>
<section><div class="w" style="max-width:760px"><h2>Questions distributors ask</h2><details><summary>Does it cost anything to enquire?</summary><p>No. Enquiries are free for distributors.</p></details><details><summary>Do you guarantee a distributorship?</summary><p>No. We connect you with the brand. The brand decides who it appoints.</p></details><details><summary>Can I apply to more than one brand?</summary><p>Yes, as many as you can serve.</p></details></div></section>`,
brands:()=>`<section><div class="w"><h2>Find brands</h2><p class="sub">Every listing shows investment, margin and territory.</p>
<div class="sbox" style="margin-bottom:22px;grid-template-columns:2fr 1fr 1fr 1fr"><input data-flt="q" value="${esc(F.q)}" placeholder="Search brand or product" aria-label="Search"><select data-flt="cat">${opts(CATS,"All categories")}</select><select data-flt="st">${opts(STATES,"All India")}</select><select data-flt="inv"><option value="">Any investment</option><option value="1" ${F.inv==="1"?"selected":""}>Under ₹5 lakh</option><option value="2" ${F.inv==="2"?"selected":""}>₹5–15 lakh</option><option value="3" ${F.inv==="3"?"selected":""}>₹15 lakh and above</option></select></div>
<label style="display:flex;gap:8px;align-items:center;margin:-8px 0 16px;font-weight:600"><input type="checkbox" data-flt="live" ${F.live?"checked":""} style="width:auto"> Show only brands offering distributorship live now</label><div class="grid" id="list">${listHTML()}</div></div></section>`,
brand:id=>{const b=brands().find(x=>x.id===id);if(!b)return`<section><div class="w"><h2>Brand not found</h2><a class="btn" href="#/brands">Back to brands</a></div></section>`;
const L=t=>`<ul class="list">${String(t||"").split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
return`<section><div class="w two" style="grid-template-columns:1.3fr 1fr"><div><span class="tag">${esc(b.cat)}</span><h2 style="margin-top:8px">${esc(b.name)}</h2><p>${esc(b.prod)}</p><dl class="kv" style="margin:16px 0"><div><dt>Investment</dt><dd>${inv(b)}</dd></div><div><dt>Margin</dt><dd>${esc(b.margin)}</dd></div><div><dt>Territory</dt><dd>${esc(b.terr)} level</dd></div><div><dt>Wanted in</dt><dd>${esc(b.state)}</dd></div></dl><h3>About</h3><p class="pre">${esc(b.about)}</p><h3>Support from the brand</h3>${L(b.support)}<h3 style="margin-top:14px">What you need</h3>${L(b.req)}</div>
<form class="f" data-f="enq" data-b="${esc(b.name)}"><h3>Enquire about ${esc(b.name)}</h3>${fields(P)}<label>Investment you can make<select name="inv">${["Under ₹5 lakh","₹5–15 lakh","₹15–50 lakh","Above ₹50 lakh"].map(x=>`<option>${x}</option>`).join("")}</select></label>${fields([["msg","Message","area"]])}<button class="btn">Send enquiry</button></form></div></section>`},
register:()=>form("Become a distributor","Create your profile once. We share it with brands that match.","reg",[...P,["inv","Investment you can make","select",["Under ₹5 lakh","₹5–15 lakh","₹15–50 lakh","Above ₹50 lakh"]],["cat","Interested category","select",CATS],["msg","Experience and godown/shop details","area"]],"Register"),
"list-brand":()=>form("List your brand","Tell us about your brand. Our team will call you.","lb",[["brand","Brand name","text"],["name","Contact person","text"],["mobile","Mobile number","tel"],["email","Email","email","opt"],["cat","Category","select",CATS],["terr","States you want distributors in","text"],["msg","Products and expected investment","area"]],"Request a callback"),
contact:()=>form("Contact us","Questions about listings or enquiries? Write to us."+(S().phone?"\nPhone: "+S().phone:"")+(S().email?"\nEmail: "+S().email:""),"ct",[["name","Your name","text"],["mobile","Mobile number","tel"],["msg","Message","area"]],"Send message"),
brand2:id=>{const b=brands().find(x=>x.id===id);if(!b)return pg.brand(id);if(CB&&CB.id!==b.id)bt="ov";CB=b;
return`<section><div class="w two" style="grid-template-columns:1.4fr 1fr"><div><div class="lg" style="justify-content:flex-start;gap:14px"><i style="background:${hue(b.name)};width:56px;height:56px;font-size:26px">${esc(b.name[0])}</i><div><h2 style="margin:0">${esc(b.name)}</h2>${liveTag(b)} <span class="tag">${esc(b.cat)}</span> <span class="tag">Demo company</span></div></div><div class="tabs" style="margin:18px 0 14px">${[["ov","Company overview"],["pr","Products"],["ab","About us"],["ct","Contact us"]].map(t=>`<button data-bt="${t[0]}" class="${bt===t[0]?"on":""}">${t[1]}</button>`).join("")}</div><div id="bc">${btab(b)}</div></div><form class="f" data-f="enq" data-b="${esc(b.name)}"><h3>Enquire about ${esc(b.name)}</h3>${fields(P)}<label>Investment you can make<select name="inv">${["Under ₹5 lakh","₹5–15 lakh","₹15–50 lakh","Above ₹50 lakh"].map(x=>`<option>${x}</option>`).join("")}</select></label>${fields([["msg","Message","area"]])}<button class="btn">Send enquiry</button></form></div></section>${vtSection(b)}`},
prospects:()=>`<section><div class="w"><h2>Distributor leads</h2><p class="sub">Prospects who want a distributorship. Names are shortened. Request contact and our team will connect you. These are sample prospects; real registrations appear in Admin under Leads.</p><div class="grid">${PROS.map(p=>`<article class="card"><div class="lg"><i style="background:${hue(p[1])}">${esc(p[1][0])}</i><span class="tag">${esc(p[4])}</span></div><h3>${esc(p[1])}, ${esc(p[2])}</h3><dl class="kv"><div><dt>Can invest</dt><dd>${esc(p[5])}</dd></div><div><dt>State</dt><dd>${esc(p[3])}</dd></div><div><dt>Experience</dt><dd>${esc(p[6])}</dd></div><div><dt>Space</dt><dd>${esc(p[7])}</dd></div></dl><button class="btn" data-pros="${p[0]}">Request contact</button></article>`).join("")}</div></div></section>`,
plans:()=>`<section><div class="w"><h2>Plans for brands</h2><p class="sub">Choose how much visibility you need. Pricing is shared on request.</p><div class="grid">${[["Starter",["1 product listing","Enquiries by email","Listed in category page"]],["Growth",["5 product listings","Featured on home page","Enquiry screening by our team","WhatsApp lead alerts"]],["Premium",["Unlimited listings","Top placement","Dedicated relationship manager","Monthly lead report"]]].map(p=>`<div class="card"><h3>${p[0]}</h3><ul class="list">${p[1].map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn" href="#/list-brand">Get a quote</a></div>`).join("")}</div></div></section>`,
about:()=>`<section><div class="w" style="max-width:720px"><h2>About Connect India Distributor</h2><p>We help Indian brands find reliable distributors, and help distributors find brands worth stocking. Every enquiry is checked by our team before it reaches a brand.</p><p>Our team comes from B2B marketplace sales, so we know what brands and buyers ask for.</p></div></section>`,
blog:()=>`<section><div class="w" style="max-width:760px"><h2>Blog</h2>${[["How to choose a distributorship","Check the brand's margin, return policy, territory rights and marketing support. Ask for existing distributor references before paying anything."],["What investment does a distributor need?","Budget for stock, godown rent, delivery and 60 days of working capital, not only the security deposit."],["Questions to ask a brand","Is the territory exclusive? Who pays for damaged stock? What targets apply in the first year?"]].map(p=>`<details><summary>${p[0]}</summary><p>${p[1]}</p></details>`).join("")}</div></section>`
};
function form(t,s,id,fs,btn){return`<section><div class="w" style="max-width:560px"><h2>${t}</h2><p class="sub pre">${esc(s)}</p><form class="f" data-f="${id}">${fields(fs)}<button class="btn">${btn}</button></form></div></section>`}
function adminHTML(){if(!admin)return`<section><div class="w" style="max-width:420px"><h2>Admin login</h2><form class="f" data-f="login"><label>Passcode<input name="p" type="password" required></label><button class="btn">Log in</button><p class="sub" style="margin:0">Default passcode is admin123. Change it in Settings.</p></form></div></section>`;
const T=[["dash","Dashboard"],["brands","Brands"],["enq","Enquiries"],["leads","Leads"],["set","Settings"]];
let h=`<section><div class="w"><h2>Admin panel</h2><div class="tabs">${T.map(t=>`<button class="${tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}<button data-act="logout">Log out</button></div>`;
const E=Object.entries(D.enq).sort((a,b)=>b[1].ts-a[1].ts),Lr=Object.entries(D.leads).sort((a,b)=>b[1].ts-a[1].ts);
const dt=t=>new Date(t).toLocaleDateString("en-IN");
if(tab==="dash")h+=`<div class="kpi"><div><strong>${Object.keys(D.brands).length||SEED.length}</strong>Brands</div><div><strong>${E.length}</strong>Enquiries</div><div><strong>${E.filter(e=>e[1].status==="New").length}</strong>New enquiries</div><div><strong>${Lr.length}</strong>Leads</div></div>${Object.keys(D.brands).length?"":`<p class="sub" style="margin-top:16px">Showing sample brands. <button class="btn sm" data-act="seed">Load samples to edit them</button></p>`}`;
if(tab==="brands")h+=`<p><button class="btn" data-act="addb">Add brand</button></p><div class="tw"><table><tr><th>Name</th><th>Category</th><th>State</th><th>Investment</th><th>Featured</th><th>Live</th><th></th></tr>${Object.keys(D.brands).length?brands().map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.cat)}</td><td>${esc(b.state)}</td><td>${inv(b)}</td><td>${b.feat?"Yes":"No"}</td><td><button class="btn sm alt" data-live="${b.id}">${isLive(b)?"Live: turn off":"Closed: go live"}</button></td><td><button class="btn sm" data-edit="${b.id}">Edit</button> <button class="btn sm red" data-del="brands:${b.id}">Delete</button></td></tr>`).join(""):`<tr><td colspan="6">No saved brands. Add one, or use Dashboard to load samples.</td></tr>`}</table></div>`;
if(tab==="enq")h+=`<p><button class="btn alt" data-act="csv:enq">Export CSV</button></p><div class="tw"><table><tr><th>Date</th><th>Brand</th><th>Name</th><th>Mobile</th><th>City</th><th>Invest</th><th>Message</th><th>Status</th><th></th></tr>${E.map(([id,e])=>`<tr><td>${dt(e.ts)}</td><td>${esc(e.brand)}</td><td>${esc(e.name)}</td><td>${esc(e.mobile)}</td><td>${esc(e.city)}, ${esc(e.state)}</td><td>${esc(e.inv)}</td><td>${esc(e.msg)}</td><td><select data-st="${id}">${["New","Contacted","Closed"].map(s=>`<option ${s===e.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn sm red" data-del="enq:${id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="9">No enquiries yet.</td></tr>'}</table></div>`;
if(tab==="leads")h+=`<p><button class="btn alt" data-act="csv:leads">Export CSV</button></p><div class="tw"><table><tr><th>Date</th><th>Type</th><th>Name</th><th>Mobile</th><th>Details</th><th></th></tr>${Lr.map(([id,e])=>`<tr><td>${dt(e.ts)}</td><td>${esc(e.type)}</td><td>${esc(e.name)}</td><td>${esc(e.mobile)}</td><td>${esc([e.brand,e.cat,e.city,e.terr,e.inv,e.msg].filter(Boolean).join(" | "))}</td><td><button class="btn sm red" data-del="leads:${id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="6">No leads yet.</td></tr>'}</table></div>`;
if(tab==="set")h+=`<form class="f" style="max-width:480px" data-f="set">${fields([["phone","Public phone","text","opt"],["email","Public email","email","opt"],["wa","WhatsApp number with country code, e.g. 919876543210","text","opt"],["newpass","New admin passcode","password","opt"]],S())}<button class="btn">Save settings</button></form>`;
return h+"</div></section>"}
const FORMS={
search:d=>{F.q=d.q;F.cat=d.cat;F.st=d.st;location.hash="#/brands"},
enq:(d,f)=>{d.brand=f.dataset.b;d.status="New";d.ts=Date.now();put("enq","e"+d.ts,d,false);done(f,d,"Enquiry about "+d.brand+" from "+d.name+", "+d.mobile+", "+d.city)},
reg:(d,f)=>lead("Distributor",d,f),lb:(d,f)=>lead("Brand",d,f),ct:(d,f)=>lead("Contact",d,f),
pr:(d,f)=>{d.msg="Prospect request: "+f.dataset.p;lead("Prospect request",d,f)},
login:d=>{if(d.p===pass()){admin=true;render()}else alert("Wrong passcode")},
set:d=>{if(d.newpass){try{localStorage.setItem("cid_pass",d.newpass)}catch(e){}}delete d.newpass;put("settings","main",d);alert("Saved")},
brand:async(d,f)=>{const id=f.dataset.id||"b"+Date.now();const old=D.brands[id]||{};d.min=+d.min;d.max=+d.max;d.feat=!!d.feat;d.live=!!d.live;const v=d.vfile;delete d.vfile;d.video=old.video||"";
if(v&&v.size){try{const a=await claude.use("assets");if(!a)throw 0;const r=await a.upload(v);d.video=r.url}catch(e){alert("Video upload needs editor access and is not available here. Other changes will be saved.")}}
put("brands",id,d);$("#dlg").close()}
};
function lead(t,d,f){d.type=t;d.ts=Date.now();put("leads","l"+d.ts,d,false);done(f,d,t+" lead: "+(d.brand||"")+" "+d.name+", "+d.mobile)}
function done(f,d,m){f.innerHTML=`<div class="ok">Thank you ${esc(d.name)}. We have received your details and will call you soon.</div>${wa(m)}${f.closest("dialog")?'<button type="button" class="btn alt" data-act="close">Close</button>':""}`}
const BF=[["name","Brand name","text"],["cat","Category","select",CATS],["state","State wanted","select",STATES],["prod","Products","text"],["min","Min investment (lakh)","number"],["max","Max investment (lakh)","number"],["margin","Margin, e.g. 15–20%","text"],["terr","Territory","select",["City","District","State"]],["about","About the brand","area"],["support","Support from brand (one per line)","area"],["req","Distributor needs (one per line)","area"],["products","Products (one per line)","area"],["phone","Contact phone","text","opt"],["email","Contact email","email","opt"],["address","Address","text","opt"],["vfile","Testimonial video (optional)","file","opt"],["live","Offering distributorship live now","check"],["feat","Show on home page","check"]];
function reqPros(id){$("#dlg").innerHTML=`<form data-f="pr" data-p="${id}"><h3>Request prospect contact</h3>${fields([["brand","Brand name","text"],["name","Your name","text"],["mobile","Mobile number","tel"],["email","Email","email","opt"]])}<div style="display:flex;gap:8px"><button class="btn">Request contact</button><button type="button" class="btn alt" data-act="close">Cancel</button></div></form>`;$("#dlg").showModal()}
function editBrand(id){const b=id?brands().find(x=>x.id===id):{};$("#dlg").innerHTML=`<form data-f="brand" data-id="${id||""}"><h3>${id?"Edit":"Add"} brand</h3>${fields(BF,{live:true,...b})}<div style="display:flex;gap:8px"><button class="btn">Save</button><button type="button" class="btn alt" data-act="close">Cancel</button></div></form>`;$("#dlg").showModal()}
async function csv(c){const rows=Object.values(D[c]);if(!rows.length)return alert("Nothing to export");const k=[...new Set(rows.flatMap(Object.keys))];const t=[k.join(","),...rows.map(r=>k.map(x=>'"'+String(r[x]??"").replace(/"/g,'""')+'"').join(","))].join("\n");
try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:c+".csv",data:t});return}}catch(e){}
try{await navigator.clipboard.writeText(t);alert("CSV copied to clipboard. Paste into Excel or Google Sheets.")}catch(e){alert("Export is not available here.")}}
function render(){const h=location.hash.replace(/^#\/?/,"").split("/");let k=h[0];
$("#app").innerHTML=k==="admin"?adminHTML():k==="brand"?pg.brand2(h[1]):(pg[k]||pg[""])();
document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+k));
$("#fc").innerHTML=(S().phone?"Phone: "+esc(S().phone)+"<br>":"")+(S().email?"Email: "+esc(S().email):"connectindiadistributor.com")}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-f]");if(!f)return;e.preventDefault();FORMS[f.dataset.f]?.(Object.fromEntries(new FormData(f)),f)});
document.addEventListener("input",e=>{const k=e.target.dataset.flt;if(!k)return;F[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;$("#list").innerHTML=listHTML()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.flt){F[t.dataset.flt]=t.type==="checkbox"?t.checked:t.value;$("#list").innerHTML=listHTML()}if(t.dataset.st){const o={...D.enq[t.dataset.st],status:t.value};put("enq",t.dataset.st,o)}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-cat],[data-tab],[data-edit],[data-del],[data-act],[data-pros],[data-sl],[data-bt],[data-vt],[data-live]");if(!t)return;const d=t.dataset;
if(d.live){if(!D.brands[d.live])alert("Load the samples first from the Dashboard.");else{const o={...D.brands[d.live]};o.live=!isLive(o);put("brands",d.live,o)}}else if(d.bt){bt=d.bt;$("#bc").innerHTML=btab(CB);document.querySelectorAll("[data-bt]").forEach(x=>x.classList.toggle("on",x.dataset.bt===bt))}else if(d.vt!==undefined){playVT(t.dataset.vu,t.dataset.vq)}else if(d.pros){reqPros(d.pros)}else if(d.sl!==undefined){slide(+d.sl)}else if(d.cat){F={q:"",cat:d.cat,st:"",inv:""};location.hash="#/brands"}
else if(d.tab){tab=d.tab;render()}else if(d.edit)editBrand(d.edit)
else if(d.del){if(confirm("Delete this item?")){const[c,id]=d.del.split(":");del(c,id)}}
else if(d.act==="addb")editBrand();else if(d.act==="close")$("#dlg").close();
else if(d.act==="logout"){admin=false;render()}
else if(d.act==="seed"){SEED.forEach(b=>{const{id,...o}=b;put("brands",id,o,false)});render()}
else if(d.act?.startsWith("csv:"))csv(d.act.slice(4))});
render();
(async()=>{try{db=await claude.use("db");const u=await claude.use("user");if(u&&await u.canEdit()){admin=true}
if(db){const sub=(c)=>db.collection(c).onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());D[c]=m;persist();render()},()=>{});
["brands","settings"].forEach(sub);if(admin)["enq","leads"].forEach(sub);render()}}catch(e){}})();
</script>
</body>
</html>
